name: Publish Blender add-on

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Build installable ZIP
        run: |
          python scripts/build_blender_addon.py \
            --git-ref "$RELEASE_TAG" \
            --output "dist/LoyalTools-${RELEASE_TAG}-Blender.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/LoyalTools-${RELEASE_TAG}-Blender.zip" \
            --clobber
